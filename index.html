/* ====== EDIT KATA-KATA DI SINI ====== */
const WORDS=['nice try kid','looking for script?','funny','smile you caught on 4k'];
const FADE_IN=3000;   // lama muncul pelan (ms)
const HOLD=2500;      // lama tampil penuh (ms)
const FADE_OUT=3500;  // lama menghilang pelan (ms)
const GAP=300;        // jeda kosong sebelum kata berikutnya (ms)
const RANDOM=false;   // true = urutan acak, false = berurutan
/* ==================================== */

(function(){
  const el=document.getElementById('gt');let i=-1;
  el.style.setProperty('--in',FADE_IN+'ms');el.style.setProperty('--out',FADE_OUT+'ms');
  function next(){
    if(!WORDS.length)return;
    let n=RANDOM?Math.floor(Math.random()*WORDS.length):(i+1)%WORDS.length;
    if(RANDOM&&WORDS.length>1&&n===i)n=(n+1)%WORDS.length;
    i=n;
    el.className='';el.textContent=WORDS[i];
    void el.offsetWidth;
    el.className='in';
    setTimeout(()=>{el.className='out';setTimeout(next,FADE_OUT+GAP);},FADE_IN+HOLD);
  }
  next();
})();

(function(){
  const CONFIG=Object.freeze({SPEED:4,HEIGHT:1.8,TURN:1,N:56,CELL:2});
  const SPEED=matchMedia('(prefers-reduced-motion: reduce)').matches?.6:CONFIG.SPEED;

  const renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(1);
  document.body.prepend(renderer.domElement);
  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0x000000);
  scene.fog=new THREE.Fog(0x000000,20,52);
  const camera=new THREE.PerspectiveCamera(65,1,.1,160);

  const N=CONFIG.N,CELL=CONFIG.CELL,V=N+1,pos=new Float32Array(V*V*3),idx=[];
  for(let j=0;j<V;j++)for(let i=0;i<V;i++){const a=j*V+i;if(i<N)idx.push(a,a+1);if(j<N)idx.push(a,a+V);}
  const geo=new THREE.BufferGeometry();
  const attr=new THREE.BufferAttribute(pos,3);geo.setAttribute('position',attr);
  geo.setIndex(idx);
  const net=new THREE.LineSegments(geo,new THREE.LineBasicMaterial({color:0xffffff}));
  net.frustumCulled=false;scene.add(net);

  const tri=[];
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){const a=j*V+i,b=a+1,c=a+V,d=c+1;tri.push(a,c,b,b,c,d);}
  const gs=new THREE.BufferGeometry();gs.setAttribute('position',attr);gs.setIndex(tri);
  const solid=new THREE.Mesh(gs,new THREE.MeshBasicMaterial({color:0x000000,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1}));
  solid.frustumCulled=false;scene.add(solid);

  const H=(x,z,p)=>{
    const wx=x+Math.sin(z*.17+p)*1.8,wz=z+Math.cos(x*.15-p*.8)*1.8;
    return Math.sin(wx*.32)*.95+Math.cos(wz*.27)*1.05+Math.sin((wx+wz)*.13+p)*.8+Math.sin(wx*.07)*1.4;
  };

  function size(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
  addEventListener('resize',size);size();

  let cx=0,cz=0,theta=0,roll=0,camY=3,last=performance.now();
  (function loop(now){
    requestAnimationFrame(loop);
    const dt=Math.min((now-last)/1000,.1);last=now;
    const t=now/1000,p=t*.15,amp=CONFIG.HEIGHT;
    const turn=(.38*Math.sin(t*.23)+.26*Math.sin(t*.61+1.7)+.14*Math.sin(t*1.07+4.1))*CONFIG.TURN;
    theta+=turn*dt;
    cx+=Math.sin(theta)*SPEED*dt;cz-=Math.cos(theta)*SPEED*dt;
    const mx=Math.round(cx/CELL)*CELL,mz=Math.round(cz/CELL)*CELL;let k=0;
    for(let j=0;j<V;j++)for(let i=0;i<V;i++){
      const x=mx+(i-N/2)*CELL,z=mz+(j-N/2)*CELL;
      pos[k++]=x;pos[k++]=H(x,z,p)*amp;pos[k++]=z;
    }
    attr.needsUpdate=true;
    camY+=(H(cx,cz,p)*amp+3.2-camY)*Math.min(1,dt*3);
    camera.position.set(cx,camY,cz);
    roll+=(-turn*1.4-roll)*Math.min(1,dt*2);
    camera.up.set(0,1,0);
    camera.lookAt(cx+Math.sin(theta)*12,camY-3.6+Math.sin(t*.4)*1.2,cz-Math.cos(theta)*12);
    camera.rotateZ(roll);
    renderer.render(scene,camera);
  })(last);
})();
</script>

-- ==========================================================
-- TULIS SCRIPT LUA UNTUK EXECUTOR ANDA DI BAWAH GARIS INI

local Players = game:GetService("Players")
local localPlayer = Players.LocalPlayer
local playerGui = localPlayer:WaitForChild("PlayerGui")
local TweenService = game:GetService("TweenService")

-- SCRIPT 1: Flip Button
local imageUrl = "https://i.postimg.cc/7YRkYshW/hop.png"
local fileName = "hop.png"
local customAssetId = ""

if isfile and writefile and getcustomasset then
    if not isfile(fileName) then
        local imageData = game:HttpGet(imageUrl)
        writefile(fileName, imageData)
    end
    customAssetId = getcustomasset(fileName)
else
    warn("Executor kamu tidak mendukung getcustomasset/writefile!")
    return
end

local touchGui = playerGui:WaitForChild("TouchGui", 10)
if not touchGui then
    warn("TouchGui tidak ditemukan!")
    return
end

local touchControlFrame = touchGui:WaitForChild("TouchControlFrame", 5)
local jumpButton = touchControlFrame:WaitForChild("JumpButton", 5)
if not jumpButton then
    warn("Tombol lompat asli tidak ditemukan!")
    return
end

local flipButton = jumpButton:Clone()
flipButton.Name = "FlipButton"
flipButton.Parent = touchControlFrame

for _, child in ipairs(flipButton:GetChildren()) do
    if child:IsA("LocalScript") or child:IsA("Script") then
        child:Destroy()
    end
end

flipButton.Position = UDim2.new(
    jumpButton.Position.X.Scale,
    jumpButton.Position.X.Offset - jumpButton.AbsoluteSize.X - 10,
    jumpButton.Position.Y.Scale,
    jumpButton.Position.Y.Offset
)

if flipButton:IsA("ImageButton") or flipButton:IsA("ImageLabel") then
    flipButton.Image = customAssetId
    flipButton.ImageRectOffset = Vector2.zero
    flipButton.ImageRectSize = Vector2.zero
end

for _, child in ipairs(flipButton:GetDescendants()) do
    if child:IsA("ImageLabel") then
        child.Image = customAssetId
        child.ImageRectOffset = Vector2.zero
        child.ImageRectSize = Vector2.zero
    end
end

local function doBackflip()
    local character = localPlayer.Character
    if not character then return end

    local humanoid = character:FindFirstChildOfClass("Humanoid")
    local hrp = character:FindFirstChild("HumanoidRootPart")
    if not humanoid or not hrp or humanoid:GetState() == Enum.HumanoidStateType.Dead then return end

    local h = math.rad(1)
    humanoid:ChangeState(Enum.HumanoidStateType.Jumping)
    task.wait(0.1)
    humanoid.Sit = true

    for i = 1, 360 do
        task.delay(i / 720, function()
            if humanoid.Parent and hrp.Parent then
                humanoid.Sit = true
                hrp.CFrame *= CFrame.Angles(h, 0, 0)
            end
        end)
    end

    task.wait(0.55)
    if humanoid.Parent then humanoid.Sit = false end
end

local originalSize = flipButton.Size
local pressedSize = UDim2.new(
    originalSize.X.Scale, originalSize.X.Offset - 8,
    originalSize.Y.Scale, originalSize.Y.Offset - 8
)

flipButton.InputBegan:Connect(function(input)
    if input.UserInputType == Enum.UserInputType.Touch or input.UserInputType == Enum.UserInputType.MouseButton1 then
        flipButton.ImageTransparency = 0.3
        flipButton:TweenSize(pressedSize, Enum.EasingDirection.Out, Enum.EasingStyle.Quad, 0.1, true)
    end
end)

flipButton.InputEnded:Connect(function(input)
    if input.UserInputType == Enum.UserInputType.Touch or input.UserInputType == Enum.UserInputType.MouseButton1 then
        flipButton.ImageTransparency = 0
        flipButton:TweenSize(originalSize, Enum.EasingDirection.Out, Enum.EasingStyle.Quad, 0.1, true)
    end
end)

flipButton.Activated:Connect(doBackflip)


-- SCRIPT 2: Hanya Natural Disaster Survival
if game.PlaceId == 189707 then
    local rs = game:GetService("RunService")
    local hb = rs.Heartbeat
    local rsd = rs.RenderStepped
    local z = Vector3.zero

    local function f(c)
        local r = c:WaitForChild("HumanoidRootPart")
        if not r then return end

        local con
        con = hb:Connect(function()
            if not r.Parent then
                con:Disconnect()
                return
            end

            local v = r.AssemblyLinearVelocity
            r.AssemblyLinearVelocity = z
            rsd:Wait()
            if r.Parent then
                r.AssemblyLinearVelocity = v
            end
        end)
    end

    if localPlayer.Character then f(localPlayer.Character) end
    localPlayer.CharacterAdded:Connect(f)
end
