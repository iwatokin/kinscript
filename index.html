<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KinScript</title>
<style>
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #fff; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

#ghost {
  position: fixed; inset: 0; z-index: 5;
  display: grid; place-items: center; padding: 24px;
  text-align: center; pointer-events: none;
  font-family: ui-monospace, Menlo, Consolas, monospace;
}
#msg {
  max-width: 90vw;
  font-size: clamp(1.3rem, 5.5vw, 2.8rem);
  line-height: 1.3;
  letter-spacing: .3em;
  text-transform: uppercase;
  opacity: 0;
  filter: blur(10px);
  transform: translateY(16px);
  text-shadow: 0 0 18px rgba(255,255,255,.6), 0 0 42px rgba(255,255,255,.25);
  transition: opacity var(--in) ease-in-out, filter var(--in) ease-in-out, transform calc(var(--in) * 2) ease-out;
}
#msg.show { opacity: .9; filter: blur(0); transform: none; }
#msg.hide {
  opacity: 0; filter: blur(9px); transform: translateY(-18px);
  transition-duration: var(--out);
}
</style>
</head>
<body>
<div id="ghost"><span id="msg"></span></div>

<script src="lib/three.min.js"></script>
<script>
// teks yang muncul bergantian
var words = ['nice try kid', 'looking for script?', 'funny', 'smile you caught on 4k'];
var tIn = 3000, tHold = 2500, tOut = 3500, tGap = 300;

var msg = document.getElementById('msg');
var cur = -1;
msg.style.setProperty('--in', tIn + 'ms');
msg.style.setProperty('--out', tOut + 'ms');

function nextWord() {
  cur = (cur + 1) % words.length;
  msg.className = '';
  msg.textContent = words[cur];
  void msg.offsetWidth;            // paksa reflow biar transisi mulai ulang
  msg.className = 'show';
  setTimeout(function () {
    msg.className = 'hide';
    setTimeout(nextWord, tOut + tGap);
  }, tIn + tHold);
}
nextWord();


// terrain kawat yang terus dilalui kamera
var speed = 4, hscale = 1.8, turnAmt = 1;
var N = 56, CELL = 2, V = N + 1;

var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(1);
document.body.prepend(renderer.domElement);

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.Fog(0x000000, 20, 52);
var cam = new THREE.PerspectiveCamera(65, 1, .1, 160);

var pos = new Float32Array(V * V * 3);
var posAttr = new THREE.BufferAttribute(pos, 3);

// garis grid
var lines = [];
for (var j = 0; j < V; j++) {
  for (var i = 0; i < V; i++) {
    var a = j * V + i;
    if (i < N) lines.push(a, a + 1);
    if (j < N) lines.push(a, a + V);
  }
}
var gLine = new THREE.BufferGeometry();
gLine.setAttribute('position', posAttr);
gLine.setIndex(lines);
var wire = new THREE.LineSegments(gLine, new THREE.LineBasicMaterial({ color: 0xffffff }));
wire.frustumCulled = false;
scene.add(wire);

// permukaan hitam di bawah garis supaya bukit di belakang tidak tembus
var faces = [];
for (var j = 0; j < N; j++) {
  for (var i = 0; i < N; i++) {
    var a = j * V + i, b = a + 1, c = a + V, d = c + 1;
    faces.push(a, c, b, b, c, d);
  }
}
var gFace = new THREE.BufferGeometry();
gFace.setAttribute('position', posAttr);
gFace.setIndex(faces);
var fill = new THREE.Mesh(gFace, new THREE.MeshBasicMaterial({
  color: 0x000000, side: THREE.DoubleSide,
  polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1
}));
fill.frustumCulled = false;
scene.add(fill);

function height(x, z, p) {
  var wx = x + Math.sin(z * .17 + p) * 1.8;
  var wz = z + Math.cos(x * .15 - p * .8) * 1.8;
  return Math.sin(wx * .32) * .95 + Math.cos(wz * .27) * 1.05
       + Math.sin((wx + wz) * .13 + p) * .8 + Math.sin(wx * .07) * 1.4;
}

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

var x0 = 0, z0 = 0, heading = 0, roll = 0, camY = 3;
var prev = performance.now();

function frame(now) {
  requestAnimationFrame(frame);
  var dt = Math.min((now - prev) / 1000, .1);
  prev = now;

  var t = now / 1000, phase = t * .15;
  var turn = (.38 * Math.sin(t * .23) + .26 * Math.sin(t * .61 + 1.7) + .14 * Math.sin(t * 1.07 + 4.1)) * turnAmt;
  heading += turn * dt;
  x0 += Math.sin(heading) * speed * dt;
  z0 -= Math.cos(heading) * speed * dt;

  // grid ikut kamera, dibulatkan ke kelipatan CELL biar tidak bergetar
  var gx = Math.round(x0 / CELL) * CELL, gz = Math.round(z0 / CELL) * CELL;
  var k = 0;
  for (var j = 0; j < V; j++) {
    for (var i = 0; i < V; i++) {
      var x = gx + (i - N / 2) * CELL, z = gz + (j - N / 2) * CELL;
      pos[k++] = x;
      pos[k++] = height(x, z, phase) * hscale;
      pos[k++] = z;
    }
  }
  posAttr.needsUpdate = true;

  camY += (height(x0, z0, phase) * hscale + 3.2 - camY) * Math.min(1, dt * 3);
  cam.position.set(x0, camY, z0);
  roll += (-turn * 1.4 - roll) * Math.min(1, dt * 2);
  cam.up.set(0, 1, 0);
  cam.lookAt(x0 + Math.sin(heading) * 12, camY - 3.6 + Math.sin(t * .4) * 1.2, z0 - Math.cos(heading) * 12);
  cam.rotateZ(roll);
  renderer.render(scene, cam);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
